pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "http://localhost:3001" $http_origin;
    }
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        location / {
            limit_except GET HEAD OPTIONS { deny all; }
            proxy_pass http://backend-seaweed:8333;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, ETag" always;
        }
    }
}
